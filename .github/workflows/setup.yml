name: Setup RUDRILA MEV Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract bot ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RUDRILA_MEV_Arb_v0_4_RISK_GUARD.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP not found: $ZIP"
            exit 1
          fi

          rm -rf _rudrila_extract
          mkdir -p _rudrila_extract
          unzip -q "$ZIP" -d _rudrila_extract

          SRC="_rudrila_extract/RUDRILA_MEV_Arb_v0_4_RISK_GUARD"
          if [ ! -d "$SRC" ]; then
            echo "::error::Expected extracted folder not found: $SRC"
            find _rudrila_extract -maxdepth 3 -type f | head -100
            exit 1
          fi

          cp -a "$SRC"/. .
          rm -rf _rudrila_extract

      - name: Keep live trading disabled
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("config.json", "config.example.json"):
              p = Path(name)
              if not p.exists():
                  continue
              d = json.loads(p.read_text())
              d["live_trading"] = False
              d["new_token_live_trading"] = False
              d["allow_public_mempool"] = False
              p.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - name: Python syntax check
        run: |
          python -m compileall -q rudrila_mev

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safety tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit extracted bot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rudrila-setup-bot"
          git config user.email "rudrila-setup-bot@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract and validate RUDRILA MEV bot v0.4"
          git push origin HEAD:main
