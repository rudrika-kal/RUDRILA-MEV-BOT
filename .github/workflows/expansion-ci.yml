name: RUDRILA MEV Expansion CI
on:
  push:
    branches: [main]
    paths:
      - "rudrila_mev/**"
      - "contracts/**"
      - "tests/**"
      - "rust_searcher/**"
      - "config*.json"
      - ".github/workflows/expansion-ci.yml"
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install solc-select
      - name: Compile Python
        run: python -m compileall -q rudrila_mev
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Rust hot-path tests
        run: cargo test --release --manifest-path rust_searcher/Cargo.toml
      - name: Compile Solidity
        run: |
          solc-select install 0.8.24
          solc-select use 0.8.24
          mkdir -p /tmp/rudrila-solc
          solc contracts/*.sol --bin --abi --overwrite -o /tmp/rudrila-solc
