name: RUDRILA MEV v0.6 Security Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v0.6 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json

          Path("rudrila_mev/honeypot_client.py").write_bytes(base64.b64decode(""))
          Path("contracts/RudrilaArbExecutor.sol").write_bytes(base64.b64decode(""))

          for name in ("config.json", "config.example.json"):
              p = Path(name)
              if p.exists():
                  d = json.loads(p.read_text())
                  d["live_trading"] = False
                  d["new_token_live_trading"] = False
                  d["allow_public_mempool"] = False
                  p.write_text(json.dumps(d, indent=2) + "\n")

          init = Path("rudrila_mev/__init__.py")
          init.write_text('__version__ = "0.6.0-security-fix"\n')
          PY

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit detect-secrets slither-analyzer
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q rudrila_mev render_monitor.py
          python -m unittest discover -s tests -p "test_*.py" -v
          solc --optimize contracts/RudrilaArbExecutor.sol --bin >/tmp/solc.txt
          cat /tmp/solc.txt

      - name: Bandit
        shell: bash
        run: |
          set +e
          bandit -r rudrila_mev -f json -o /tmp/bandit.json
          echo $? > /tmp/bandit.exit
          exit 0

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o /tmp/pip-audit.json
          echo $? > /tmp/pip-audit.exit
          exit 0

      - name: Secret scan
        shell: bash
        run: |
          set +e
          detect-secrets scan             rudrila_mev contracts tests render_monitor.py config.json config.example.json             > /tmp/secrets.json
          echo $? > /tmp/secrets.exit
          exit 0

      - name: Slither
        shell: bash
        run: |
          set +e
          slither contracts/RudrilaArbExecutor.sol             --solc solc             --json /tmp/slither.json             >/tmp/slither.txt 2>&1
          echo $? > /tmp/slither.exit
          cat /tmp/slither.txt || true
          exit 0

      - name: Generate report and enforce gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, sys

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          bandit = load("/tmp/bandit.json")
          deps = load("/tmp/pip-audit.json")
          secrets = load("/tmp/secrets.json")
          slither = load("/tmp/slither.json")

          b_bad = [
              x for x in bandit.get("results", [])
              if str(x.get("issue_severity", "")).upper() in {"MEDIUM", "HIGH"}
          ]

          dep_vulns = sum(
              len(x.get("vulns", []) or [])
              for x in deps.get("dependencies", [])
              if isinstance(x, dict)
          )

          detectors = (slither.get("results", {}) or {}).get("detectors", []) if isinstance(slither, dict) else []
          s_bad = [
              d for d in detectors
              if str(d.get("impact", "")).lower() in {"medium", "high"}
          ]

          secret_rows = []
          for filename, rows in (secrets.get("results", {}) or {}).items():
              for row in rows:
                  secret_rows.append((filename, row.get("line_number"), row.get("type")))

          actionable_secrets = []
          for filename, line, kind in secret_rows:
              # Config stores only environment-variable NAMES, not secret values.
              if filename in {"config.json", "config.example.json"} and kind == "Secret Keyword":
                  continue
              actionable_secrets.append((filename, line, kind))

          report = [
              "# RUDRILA MEV v0.6 Security Report",
              "",
              f"Generated: {datetime.now(timezone.utc).isoformat()}",
              "",
              f"- Bandit medium/high: **{len(b_bad)}**",
              f"- Dependency vulnerabilities: **{dep_vulns}**",
              f"- Slither medium/high: **{len(s_bad)}**",
              f"- Actionable secret candidates: **{len(actionable_secrets)}**",
              "",
              "## Notes",
              "- Live trading remains OFF.",
              "- Slither non-zero process exit alone is not treated as a failure; actual medium/high detector findings are the gate.",
              "- config.json private_key_env is an environment-variable name, not a private-key value.",
              "",
              "## Remaining before live trading",
              "- Validate honeypot/tax simulation on real new pools.",
              "- Add LP lock/burn proof and admin privilege evidence.",
              "- Fork-test the executor and failure paths.",
              "- Validate all-cost net-profit gate end to end.",
              "- Validate private submission.",
              "- Complete large dry-run audit, then tiny canary only after all gates pass.",
          ]

          if b_bad:
              report += ["", "## Bandit findings"]
              for x in b_bad:
                  report.append(f"- {x.get('filename')}:{x.get('line_number')} {x.get('test_id')} {x.get('issue_text')}")
          if s_bad:
              report += ["", "## Slither findings"]
              for d in s_bad:
                  report.append(f"- {d.get('impact')} / {d.get('check')} — {str(d.get('description','')).strip()}")
          if actionable_secrets:
              report += ["", "## Actionable secret candidates"]
              for row in actionable_secrets:
                  report.append(f"- {row[0]}:{row[1]} — {row[2]}")

          Path("V06_SECURITY_REPORT.md").write_text("\n".join(report) + "\n")

          failures = []
          if b_bad:
              failures.append(f"Bandit medium/high={len(b_bad)}")
          if dep_vulns:
              failures.append(f"Dependency vulnerabilities={dep_vulns}")
          if s_bad:
              failures.append(f"Slither medium/high={len(s_bad)}")
          if actionable_secrets:
              failures.append(f"Actionable secrets={len(actionable_secrets)}")

          if failures:
              print("V0.6 SECURITY GATE FAIL")
              for f in failures:
                  print("-", f)
              Path("/tmp/gate_failed").write_text("\n".join(failures))
          else:
              print("V0.6 AUTOMATED SECURITY GATE PASS")
          PY

      - name: Commit v0.6 fixes and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rudrila-v06-bot"
          git config user.email "rudrila-v06-bot@users.noreply.github.com"
          git add             rudrila_mev/honeypot_client.py             rudrila_mev/__init__.py             contracts/RudrilaArbExecutor.sol             config.json config.example.json             V06_SECURITY_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix RUDRILA MEV v0.6 security blockers"
            git push origin HEAD:main
          fi

      - name: Final gate status
        shell: bash
        run: |
          if [ -f /tmp/gate_failed ]; then
            cat /tmp/gate_failed
            exit 1
          fi
          echo "RUDRILA MEV v0.6 automated security gate PASS."
