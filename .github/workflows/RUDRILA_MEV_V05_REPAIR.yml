name: RUDRILA MEV v0.5 Repair and Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v0.5 security hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json

          files = json.loads('{"rudrila_mev/evm.py": "", "rudrila_mev/launch_monitor.py": "", "rudrila_mev/ledger.py": "", "rudrila_mev/rpc_pool.py": "", "rudrila_mev/honeypot_client.py": "", "rudrila_mev/abi.py": "", "contracts/RudrilaArbExecutor.sol": "", "tests/test_honeypot_client.py": "", "tests/test_evm_security.py": "", "render_monitor.py": "", "requirements.txt": "d2ViMz09OC4wLjAKZXRoLWFjY291bnQ9PTAuMTQuMApyZXF1ZXN0cz09Mi4zNC4yCg==", "rudrila_mev/__init__.py": "X192ZXJzaW9uX18gPSAiMC41LjAtc2VjdXJpdHktaGFyZGVuaW5nIgo="}')
          for path, data in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))

          for name in ("config.json", "config.example.json"):
              p = Path(name)
              if p.exists():
                  d = json.loads(p.read_text())
                  d["live_trading"] = False
                  d["new_token_live_trading"] = False
                  d["allow_public_mempool"] = False
                  p.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - name: Install dependencies and security tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit detect-secrets slither-analyzer
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Python compile
        shell: bash
        run: |
          set +e
          python -m compileall -q rudrila_mev render_monitor.py
          echo $? > python-compile.exit
          exit 0

      - name: Run all unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v > unit-tests.txt 2>&1
          echo $? > unit-tests.exit
          cat unit-tests.txt
          exit 0

      - name: Solidity compile
        shell: bash
        run: |
          set +e
          solc --optimize contracts/RudrilaArbExecutor.sol --bin > solc.txt 2>&1
          echo $? > solc.exit
          cat solc.txt
          exit 0

      - name: Bandit security scan
        shell: bash
        run: |
          set +e
          bandit -r rudrila_mev -f json -o bandit.json
          echo $? > bandit.exit
          exit 0

      - name: Dependency vulnerability audit
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o pip-audit.json
          echo $? > pip-audit.exit
          exit 0

      - name: Secret candidate scan
        shell: bash
        run: |
          set +e
          detect-secrets scan \
            --all-files \
            --exclude-files '.*\.zip$' \
            --exclude-files 'SECURITY_SCAN_REPORT\.md' \
            --exclude-files 'V05_REPAIR_REPORT\.md' \
            > detect-secrets.json
          echo $? > detect-secrets.exit
          exit 0

      - name: Slither Solidity audit
        shell: bash
        run: |
          set +e
          slither contracts/RudrilaArbExecutor.sol \
            --solc solc \
            --json slither.json \
            > slither.txt 2>&1
          echo $? > slither.exit
          cat slither.txt || true
          exit 0

      - name: Generate v0.5 audit report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          def read(path, default=""):
              p = Path(path)
              return p.read_text(errors="replace") if p.exists() else default

          def code(path):
              try:
                  return int(read(path, "999").strip())
              except Exception:
                  return 999

          def load(path):
              try:
                  return json.loads(read(path, "{}"))
              except Exception:
                  return {}

          bandit = load("bandit.json")
          deps = load("pip-audit.json")
          secrets = load("detect-secrets.json")
          slither = load("slither.json")

          b_results = bandit.get("results", []) if isinstance(bandit, dict) else []
          b_bad = [
              x for x in b_results
              if str(x.get("issue_severity", "")).upper() in {"MEDIUM", "HIGH"}
          ]

          dep_vulns = 0
          if isinstance(deps, dict):
              for d in deps.get("dependencies", []) or []:
                  dep_vulns += len(d.get("vulns", []) or [])

          secret_rows = []
          if isinstance(secrets, dict):
              for filename, rows in (secrets.get("results", {}) or {}).items():
                  for row in rows:
                      secret_rows.append({
                          "file": filename,
                          "line": row.get("line_number"),
                          "type": row.get("type"),
                      })

          detectors = []
          if isinstance(slither, dict):
              detectors = (slither.get("results", {}) or {}).get("detectors", []) or []
          s_bad = [
              d for d in detectors
              if str(d.get("impact", "")).lower() in {"medium", "high"}
          ]

          report = [
              "# RUDRILA MEV v0.5 Repair & Security Report",
              "",
              f"Generated: {datetime.now(timezone.utc).isoformat()}",
              "",
              "## Automated results",
              f"- Python compile exit: **{code('python-compile.exit')}**",
              f"- Unit tests exit: **{code('unit-tests.exit')}**",
              f"- Solidity compile exit: **{code('solc.exit')}**",
              f"- Bandit medium/high findings: **{len(b_bad)}**",
              f"- Dependency vulnerabilities: **{dep_vulns}**",
              f"- Secret candidates needing review: **{len(secret_rows)}**",
              f"- Slither exit: **{code('slither.exit')}**",
              f"- Slither medium/high findings: **{len(s_bad)}**",
              "",
              "## Hardening applied",
              "- HTTPS-only private RPC client.",
              "- Removed silent except/continue Bandit findings.",
              "- Base token and quote token must be different.",
              "- Executor router allowlist.",
              "- Token/router contract-code checks.",
              "- Positive minimum-profit requirement.",
              "- Pre-existing quote-token dust excluded from trade accounting.",
              "- Router approvals reset after swaps.",
              "- External BSC honeypot buy/sell simulation parser.",
              "- Buy/sell tax, gas, source/proxy, holder-failure and high-tax checks.",
              "- Live trading remains OFF.",
              "",
              "## Secret candidates",
          ]
          if secret_rows:
              for row in secret_rows:
                  report.append(f"- {row['file']}:{row['line']} — {row['type']}")
          else:
              report.append("- None detected.")

          report += ["", "## Bandit medium/high"]
          if b_bad:
              for x in b_bad:
                  report.append(
                      f"- {x.get('filename')}:{x.get('line_number')} "
                      f"{x.get('issue_severity')} {x.get('test_id')} "
                      f"{x.get('issue_text')}"
                  )
          else:
              report.append("- None.")

          report += ["", "## Slither medium/high"]
          if s_bad:
              for d in s_bad:
                  report.append(
                      f"- {d.get('impact')} / {d.get('check')} — "
                      f"{str(d.get('description', '')).strip()}"
                  )
          else:
              report.append("- None.")

          report += [
              "",
              "## Remaining before live trading",
              "- Validate external honeypot API against live newly launched candidates.",
              "- Add independent admin/mint/blacklist/pause/fee-change evidence source.",
              "- Add V2 LP burn/lock proof; V3 live trading remains blocked until equivalent proof exists.",
              "- Fork-test the hardened executor and failure paths.",
              "- Validate gas + DEX fee + tax + slippage + safety reserve + minimum NET profit end to end.",
              "- Validate private transaction submission.",
              "- Complete large dry-run audit and tiny canary only after every critical gate passes.",
              "",
          ]
          Path("V05_REPAIR_REPORT.md").write_text("\n".join(report))
          PY

      - name: Commit hardened v0.5 source and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rudrila-v05-bot"
          git config user.email "rudrila-v05-bot@users.noreply.github.com"
          git add \
            rudrila_mev \
            contracts/RudrilaArbExecutor.sol \
            tests \
            render_monitor.py \
            requirements.txt \
            config.json \
            config.example.json \
            V05_REPAIR_REPORT.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Harden RUDRILA MEV bot v0.5 and add honeypot simulation gate"
            git push origin HEAD:main
          fi

      - name: Enforce critical security gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys

          def code(path):
              try:
                  return int(Path(path).read_text().strip())
              except Exception:
                  return 999

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          bandit = load("bandit.json")
          deps = load("pip-audit.json")
          slither = load("slither.json")

          b_bad = [
              x for x in bandit.get("results", [])
              if str(x.get("issue_severity", "")).upper() in {"MEDIUM", "HIGH"}
          ]
          dep_vulns = sum(
              len(x.get("vulns", []) or [])
              for x in deps.get("dependencies", [])
              if isinstance(x, dict)
          )
          detectors = (slither.get("results", {}) or {}).get("detectors", []) if isinstance(slither, dict) else []
          s_bad = [
              d for d in detectors
              if str(d.get("impact", "")).lower() in {"medium", "high"}
          ]

          failures = []
          if code("python-compile.exit") != 0:
              failures.append("Python compile failed")
          if code("unit-tests.exit") != 0:
              failures.append("Unit tests failed")
          if code("solc.exit") != 0:
              failures.append("Solidity compile failed")
          if b_bad:
              failures.append(f"Bandit medium/high findings: {len(b_bad)}")
          if dep_vulns:
              failures.append(f"Dependency vulnerabilities: {dep_vulns}")
          if code("slither.exit") != 0:
              failures.append("Slither execution/compilation failed")
          if s_bad:
              failures.append(f"Slither medium/high findings: {len(s_bad)}")

          if failures:
              print("CRITICAL GATE NOT CLEAR:")
              for f in failures:
                  print("-", f)
              sys.exit(1)

          print("Critical automated v0.5 security gate PASS.")
          PY
