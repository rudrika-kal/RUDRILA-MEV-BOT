name: RUDRILA MEV v0.7 Final Solidity Security Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-solidity-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v0.7 executor fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json

          Path("contracts/RudrilaArbExecutor.sol").write_bytes(
              base64.b64decode("")
          )

          for name in ("config.json", "config.example.json"):
              p = Path(name)
              if p.exists():
                  d = json.loads(p.read_text())
                  d["live_trading"] = False
                  d["new_token_live_trading"] = False
                  d["allow_public_mempool"] = False
                  p.write_text(json.dumps(d, indent=2) + "\n")

          Path("rudrila_mev/__init__.py").write_text(
              '__version__ = "0.7.0-final-solidity-security"\n'
          )
          PY

      - name: Install audit tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit detect-secrets slither-analyzer
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Compile and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q rudrila_mev render_monitor.py
          python -m unittest discover -s tests -p "test_*.py" -v
          solc --optimize contracts/RudrilaArbExecutor.sol --bin >/tmp/solc.txt
          cat /tmp/solc.txt

      - name: Bandit
        shell: bash
        run: |
          set +e
          bandit -r rudrila_mev -f json -o /tmp/bandit.json
          exit 0

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o /tmp/pip-audit.json
          exit 0

      - name: Secret scan
        shell: bash
        run: |
          set +e
          detect-secrets scan             rudrila_mev contracts tests render_monitor.py config.json config.example.json             > /tmp/secrets.json
          exit 0

      - name: Slither
        shell: bash
        run: |
          set +e
          slither contracts/RudrilaArbExecutor.sol             --solc solc             --json /tmp/slither.json             >/tmp/slither.txt 2>&1
          cat /tmp/slither.txt || true
          exit 0

      - name: Build v0.7 report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          bandit = load("/tmp/bandit.json")
          deps = load("/tmp/pip-audit.json")
          secrets = load("/tmp/secrets.json")
          slither = load("/tmp/slither.json")

          b_bad = [
              x for x in bandit.get("results", [])
              if str(x.get("issue_severity", "")).upper() in {"MEDIUM", "HIGH"}
          ]

          dep_vulns = sum(
              len(x.get("vulns", []) or [])
              for x in deps.get("dependencies", [])
              if isinstance(x, dict)
          )

          detectors = (
              (slither.get("results", {}) or {}).get("detectors", [])
              if isinstance(slither, dict)
              else []
          )
          s_bad = [
              x for x in detectors
              if str(x.get("impact", "")).lower() in {"medium", "high"}
          ]

          secret_rows = []
          for filename, rows in (secrets.get("results", {}) or {}).items():
              for row in rows:
                  if (
                      filename in {"config.json", "config.example.json"}
                      and row.get("type") == "Secret Keyword"
                  ):
                      continue
                  secret_rows.append(
                      (filename, row.get("line_number"), row.get("type"))
                  )

          report = [
              "# RUDRILA MEV v0.7 Security Report",
              "",
              f"Generated: {datetime.now(timezone.utc).isoformat()}",
              "",
              "## Automated gate",
              f"- Bandit medium/high: **{len(b_bad)}**",
              f"- Dependency vulnerabilities: **{dep_vulns}**",
              f"- Actionable secret candidates: **{len(secret_rows)}**",
              f"- Slither medium/high: **{len(s_bad)}**",
              "",
              "## v0.7 executor changes",
              "- Removed strict zero-balance equality checks.",
              "- Auto-sweeps stale base/quote dust to owner before each trade.",
              "- Uses absolute post-swap balances after a clean start.",
              "- Router return arrays are validated inside the swap helper.",
              "- No post-call use of stale router-return variables.",
              "- Owner-only, nonReentrant, router allowlist, short deadline and positive min-profit remain enforced.",
              "- Live trading remains OFF.",
              "",
              "## Still required before live trading",
              "- Real new-pool honeypot/tax validation.",
              "- LP lock/burn and admin privilege evidence.",
              "- Fork executor/failure-path test.",
              "- End-to-end gas + DEX fee + tax + slippage + safety buffer + minimum NET-profit validation.",
              "- Private submission validation.",
              "- Large dry-run audit, then tiny canary only after every critical gate passes.",
          ]

          if b_bad:
              report += ["", "## Bandit findings"]
              for x in b_bad:
                  report.append(
                      f"- {x.get('filename')}:{x.get('line_number')} "
                      f"{x.get('test_id')} {x.get('issue_text')}"
                  )

          if s_bad:
              report += ["", "## Slither findings"]
              for x in s_bad:
                  report.append(
                      f"- {x.get('impact')} / {x.get('check')} — "
                      f"{str(x.get('description', '')).strip()}"
                  )

          if secret_rows:
              report += ["", "## Actionable secret candidates"]
              for x in secret_rows:
                  report.append(f"- {x[0]}:{x[1]} — {x[2]}")

          Path("V07_SECURITY_REPORT.md").write_text(
              "\n".join(report) + "\n"
          )

          failures = []
          if b_bad:
              failures.append(f"Bandit medium/high={len(b_bad)}")
          if dep_vulns:
              failures.append(f"Dependency vulnerabilities={dep_vulns}")
          if secret_rows:
              failures.append(f"Actionable secrets={len(secret_rows)}")
          if s_bad:
              failures.append(f"Slither medium/high={len(s_bad)}")

          if failures:
              Path("/tmp/v07_fail").write_text("\n".join(failures))
              print("V0.7 AUTOMATED SECURITY GATE FAIL")
              for f in failures:
                  print("-", f)
          else:
              print("V0.7 AUTOMATED SECURITY GATE PASS")
          PY

      - name: Commit v0.7 fixes and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rudrila-v07-bot"
          git config user.email "rudrila-v07-bot@users.noreply.github.com"

          git add             contracts/RudrilaArbExecutor.sol             rudrila_mev/__init__.py             config.json             config.example.json             V07_SECURITY_REPORT.md

          if ! git diff --cached --quiet; then
            git commit -m "Resolve RUDRILA MEV v0.7 Solidity security findings"
            git push origin HEAD:main
          fi

      - name: Final v0.7 gate
        shell: bash
        run: |
          if [ -f /tmp/v07_fail ]; then
            echo "Remaining critical findings:"
            cat /tmp/v07_fail
            exit 1
          fi

          echo "RUDRILA MEV v0.7 automated security gate PASS."
